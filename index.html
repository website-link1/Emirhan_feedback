<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="color-scheme" content="dark light">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src data: blob:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>EMIRHAN · Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--bgA:rgba(7,11,22,.8);--gold14:rgba(212,175,97,.14);--gold16:rgba(212,175,97,.16);--gold28:rgba(212,175,97,.3);--gold45:rgba(212,175,97,.45);--gold55:rgba(212,175,97,.55);--goldDeep:#94793f;--cardHi:#1a2030;--accDeep:#1c6b5c;--acc18:rgba(47,179,154,.18);--bg:#070b16;--card:#0e1424;--gold:#d4af61;--gold2:#f6e3a8;--acc:#2fb39a;--ink:#f4ecd8;--muted:#a59c87;--line:rgba(212,175,97,.28);--field:rgba(0,0,0,.28);--starOff:rgba(255,255,255,.14);--shadow:0 30px 80px rgba(0,0,0,.45);--wall:none;--spd:1;--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','PingFang SC','Hiragino Sans',sans-serif;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--wall),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--sans);line-height:1.5;overflow-x:hidden;transition:background-color .6s,color .4s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.hidden{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.blob{position:fixed;width:70vmax;height:70vmax;border-radius:50%;pointer-events:none;z-index:0;opacity:.18;filter:blur(40px);animation:drift calc(28s/var(--spd)) ease-in-out infinite alternate}
.blob.b1{background:radial-gradient(circle,var(--gold),transparent 62%);top:-35vmax;left:-30vmax}
.blob.b2{background:radial-gradient(circle,var(--acc),transparent 62%);bottom:-38vmax;right:-32vmax;animation-duration:calc(36s/var(--spd))}
body.noblobs .blob{display:none}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.08)}}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--bgA);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);color:var(--gold);letter-spacing:.32em;font-size:19px;line-height:1.05;user-select:none;-webkit-user-select:none;cursor:default}
.brand small{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:.62em;color:var(--muted);margin-top:4px}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{height:42px;min-width:42px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--gold2);transition:transform .2s,border-color .2s}
.ibtn:active{transform:scale(.94)}.ibtn .fl{font-size:18px;line-height:1}
main{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left)) 40px}
.greet{display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(110deg,var(--gold14),transparent 60%),var(--field);font-size:14px;color:var(--gold2);animation:rise .8s both}
.greet b{font-size:24px}
.greet span{background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine calc(6s/var(--spd)) linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.hero{text-align:center;padding:18px 0 6px}
.kicker{font-size:12px;letter-spacing:.42em;font-weight:700;color:var(--gold);text-transform:uppercase}
.logo{font-family:var(--serif);font-weight:700;font-size:clamp(40px,12.5vw,66px);letter-spacing:.16em;margin:6px 0 4px;padding-left:.16em;line-height:1.1;background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 55%,var(--goldDeep) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 6px 22px var(--gold28))}
.card{position:relative;margin-top:18px;padding:28px 22px;border-radius:var(--r);background:linear-gradient(160deg,var(--cardHi),var(--card));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.card::before,.card::after{content:'';position:absolute;width:34px;height:34px;border:2px solid var(--gold);pointer-events:none;opacity:.75}
.card::before{top:10px;left:10px;border-right:0;border-bottom:0;border-top-left-radius:8px}
.card::after{bottom:10px;right:10px;border-left:0;border-top:0;border-bottom-right-radius:8px}
.step{display:none}.step.on{display:block;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2}
.q{font-size:clamp(22px,6.2vw,30px);text-align:center;font-style:italic;color:var(--gold2)}
.hint{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.stars{display:flex;justify-content:center;gap:clamp(4px,2vw,12px);margin:26px 0 10px}
.star{width:clamp(46px,14vw,60px);height:clamp(46px,14vw,60px);padding:4px;border-radius:14px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.star svg{width:100%;height:100%;display:block;overflow:visible}
.star path{fill:var(--starOff);stroke:var(--gold45);stroke-width:1;transition:fill .25s,filter .25s}
.star.on path{fill:url(#gGold);stroke:var(--goldDeep);filter:drop-shadow(0 0 8px var(--gold55))}
.star.on{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.star:hover{transform:translateY(-3px) scale(1.06)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.phrase{min-height:56px;text-align:center;font-family:var(--serif);font-size:clamp(18px,5vw,22px);font-weight:600;color:var(--gold);padding:4px 6px;transition:opacity .3s}
.btn{position:relative;overflow:hidden;width:100%;min-height:56px;padding:14px 20px;border-radius:16px;font-weight:700;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .18s,box-shadow .3s,opacity .3s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-gold{background:linear-gradient(135deg,var(--gold2) -20%,var(--gold) 45%,var(--goldDeep));color:#1d1406;box-shadow:0 14px 34px var(--gold28)}
body.glare .btn-gold::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:glare calc(4.5s/var(--spd)) ease-in-out infinite}
@keyframes glare{0%,55%{left:-60%}100%{left:130%}}
.btn-line{border:1.5px solid var(--gold);color:var(--gold2);background:transparent}
.btn-ghost{color:var(--muted);font-weight:600;min-height:44px;font-size:14px}
.btn-g{background:#fff;color:#1f2433;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.btn-y{background:linear-gradient(135deg,#ff6a3d,#d9381e);color:#fff;box-shadow:0 10px 30px rgba(217,56,30,.3)}
.btn-both{background:linear-gradient(135deg,var(--acc),var(--accDeep));color:#fff}
.stack{display:grid;gap:12px;margin-top:18px}
.lbl{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:20px 0 10px}
textarea,input[type=text],input[type=password],input[type=search],input[type=url],select{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--field);padding:14px 16px;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;resize:vertical}
textarea{min-height:120px}
textarea:focus,input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold16)}
::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-size:14px;font-weight:600;color:var(--ink);transition:all .2s}
.chip.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1406;border-color:transparent;box-shadow:0 6px 16px var(--gold28)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:18px;cursor:pointer}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--gold);display:grid;place-items:center;transition:background .2s}
.box::after{content:'';width:7px;height:13px;border:solid #1d1406;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .2s}
.check input:checked+.box{background:var(--gold)}
.check input:checked+.box::after{transform:rotate(45deg) scale(1)}
.check b{display:block;font-size:15px}.check small{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.seg button{min-height:46px;border-radius:12px;font-weight:700;color:var(--muted);transition:all .25s}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1406;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:14px}
.res-stars{display:flex;justify-content:center;gap:8px;margin:6px 0 16px}
.res-stars svg{width:42px;height:42px;opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.res-stars path{fill:url(#gGold);filter:drop-shadow(0 0 10px var(--gold55))}
.res-stars .off path{fill:var(--starOff);filter:none}
.res-t{text-align:center;font-size:clamp(24px,7vw,32px)}
.res-s{text-align:center;font-family:var(--serif);font-style:italic;color:var(--gold);margin:8px 0 0;font-size:17px}
.preview{margin-top:18px;padding:16px;border-radius:16px;border:1px dashed var(--line);background:var(--field)}
.preview .pv-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.preview .pv-st{color:var(--gold);letter-spacing:2px;font-size:16px}
.preview p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.preview .pv-n{margin-top:8px;font-weight:700;color:var(--gold2);font-size:14px}
.small{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.foot{position:relative;z-index:1;text-align:center;font-size:11px;letter-spacing:.3em;color:var(--muted);padding:0 16px 28px;text-transform:uppercase}
/* modals */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:12px}
.modal.on{display:flex;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:90dvh;overflow:auto;padding:24px 20px calc(20px + env(safe-area-inset-bottom));border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:up .4s cubic-bezier(.2,.8,.2,1) both}
@media(min-width:640px){.modal{align-items:center}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:22px;color:var(--gold2);text-align:center;margin-bottom:6px}
.sheet .x{float:right;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:18px;margin:-8px -6px 0 0}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.langs button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--field);font-weight:600;text-align:left}
.langs button.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold16)}
.langs .fl{font-size:24px}
.err{color:#ff8a7a;font-size:13px;min-height:20px;text-align:center;margin-top:8px}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-size:14px;display:block;margin:12px auto 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:90;max-width:min(92vw,440px);padding:13px 18px;border-radius:14px;background:var(--card);color:var(--gold2);border:1px solid var(--gold);box-shadow:var(--shadow);font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* admin */
#admin{position:fixed;inset:0;z-index:50;display:none;overflow:auto;background:var(--wall),var(--bg)}
#admin.on{display:block;animation:fade .25s both}
.ad-wrap{max-width:980px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 60px}
.ad-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0 14px;background:linear-gradient(var(--bg) 70%,transparent)}
.ad-head h2{flex:1;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.role{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--gold);color:#1d1406}
.role.mst{background:linear-gradient(135deg,#b48cff,#6b4fd8);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.tab{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:14px;color:var(--ink)}
.tab.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1406;border-color:transparent}
.pane{display:none}.pane.on{display:block;animation:rise .35s both}
.panel{padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.panel h3{font-size:20px;color:var(--gold2);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.kpi small{color:var(--muted);font-size:12px}.kpi b{display:block;font-family:var(--serif);font-size:30px;color:var(--gold2);margin-top:4px}
.bar{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar i{display:block;height:10px;border-radius:99px;background:var(--field);overflow:hidden}
.bar i em{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .8s}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>*{flex:1 1 180px}
.rv{padding:16px;border-radius:16px;background:var(--field);border:1px solid var(--line);margin-bottom:10px}
.rv.done{opacity:.6}
.rv-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rv-h .st{color:var(--gold);letter-spacing:2px;font-size:16px}
.rv p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line);margin:2px 4px 2px 0}
.badge.mgr{background:rgba(255,120,100,.14);color:#ff9d8c}
.badge.pub{background:var(--acc18);color:var(--acc)}
.mini{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--gold2)}
.mini.red{color:#ff9d8c;border-color:rgba(255,120,100,.4)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.tg{position:relative;flex:none;width:52px;height:30px}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg span{position:absolute;inset:0;border-radius:99px;background:var(--field);border:1px solid var(--line);transition:.25s}
.tg span::before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:var(--muted);transition:.25s}
.tg input:checked+span{background:var(--gold)}
.tg input:checked+span::before{transform:translateX(22px);background:#1d1406}
.starpick{display:flex;gap:8px;flex-wrap:wrap}
.starpick button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-weight:700;color:var(--muted)}
.starpick button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1406;border-color:transparent}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.colors label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.colors input{width:100%;height:52px;margin-top:6px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:4px;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:10px 0 20px}
.tpl{position:relative;padding:16px 10px 12px;border-radius:16px;border:1px solid var(--line);text-align:center;font-size:13px;font-weight:700;color:#fff;overflow:hidden;min-height:104px;transition:transform .2s}
.tpl:active{transform:scale(.96)}
.tpl .e{display:block;font-size:30px;margin-bottom:6px}
.tpl.on{outline:3px solid var(--gold);outline-offset:2px}
.tpl .dots{display:flex;justify-content:center;gap:4px;margin-top:8px}
.tpl .dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.wcard{flex:0 0 min(62%,220px);scroll-snap-align:center;aspect-ratio:3/4;border-radius:20px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:14px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.wcard.on{outline:3px solid var(--gold);outline-offset:2px}
.cnav{display:flex;gap:10px;justify-content:center}
.tedit{display:grid;gap:12px;margin-top:12px}
.tedit label{display:block;font-size:12px;color:var(--muted)}
.tedit label code{color:var(--gold);font-size:11px;margin-right:6px}
.tedit textarea{min-height:56px;margin-top:4px;font-size:15px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 48px;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1d1406}
.mzone{border-color:#8b6fe0;background:linear-gradient(160deg,rgba(139,111,224,.12),var(--card))}
body.reduce *,body.reduce *::before,body.reduce *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#f2c75c"/><stop offset="1" stop-color="#b8862b"/></linearGradient></defs></svg>
<div class="blob b1"></div><div class="blob b2"></div><canvas id="fx"></canvas>
<header class="top">
  <div class="brand" id="brand"><span id="brandName">EMIRHAN</span><small id="brandSub">FEEDBACK</small></div>
  <div class="tools">
    <button class="ibtn" id="langBtn" data-ta="lang"><span class="fl" id="langFlag">🇷🇺</span><span id="langCode">RU</span></button>

function renderReqList(){const box=$('#reqList');if(!box)return;const q=ADM.rq.toLowerCase();let L=R.filter(r=>ADM.rf==='all'||(ADM.rf==='mgr'&&r.route==='mgr')||(ADM.rf==='pub'&&r.route==='pub')||(ADM.rf==='contact'&&r.contact));

 box.innerHTML=KEYS.filter(k=>k!=='lname').filter(k=>!q||k.toLowerCase().includes(q)||String(I18N[l][k]).toLowerCase().includes(q)||String(ov[k]||'').toLowerCase().includes(q)).map(k=>'<label><code>'+k+'</code>'+esc(I18N.ru[k])+'<textarea data-act="txt" data-k="'+k+'" maxlength="700">'+esc(ov[k]!=null?ov[k]:I18N[l][k])+'</textarea></label>').join('')}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}

function exportCSV(){const head=['date','stars','name','anonymous','comment','liked','contact','language','route','opened','resolved'];const rows=R.map(r=>[new Date(r.ts).toISOString(),r.r,r.name,r.anon?'yes':'no',r.c,r.tags.map(k=>I18N.ru[k]).join('; '),r.contact,r.lang,r.route,r.clicks.map(c=>c.p).join(' '),r.done?'yes':'no']);download('emirhan-reviews-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}

function importJSON(file){if(!file)return;if(file.size>8e6){toast(t('sBad'));return}const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!isObj(o)||!(o.app==='emirhan-feedback'||isObj(o.settings)))throw 0;
 const ns=sanitizeSettings(o.settings);ns.mgrHash=ns.mgrHash||S.mgrHash;ns.mstHash=(ADM.role==='master'&&ns.mstHash)?ns.mstHash:S.mstHash;
 const map=new Map(R.map(r=>[r.id,r]));(Array.isArray(o.reviews)?o.reviews:[]).map(sanitizeReview).filter(Boolean).forEach(r=>{if(!map.has(r.id))map.set(r.id,r)});
 S=ns;R=[...map.values()].sort((a,b)=>b.ts-a.ts);saveS();saveR();applyTheme();applyI18n();toast(t('sImported'))}catch(e){toast(t('sBad'))}};fr.readAsText(file)}
let saveT;const deb=fn=>{clearTimeout(saveT);saveT=setTimeout(fn,350)};
function onAdmin(e){const el=e.target.closest('[data-act],[data-tab]');if(!el)return;
 if(el.dataset.tab){if(e.type!=='click')return;ADM.tab=el.dataset.tab;renderAdmin();return}
 const a=el.dataset.act,type=e.type;
 if(type==='input'){
  if(a==='rq'){ADM.rq=el.value;renderReqList()}else if(a==='tf'){ADM.tf=el.value;renderTextList()}
  else if(a==='ag'||a==='ay'){S.auto[a==='ag'?'g':'y']=clean(el.value,400);deb(saveS)}
  else if(a==='color'&&isHex(el.value)){S.colors[el.dataset.k]=el.value.toLowerCase();applyTheme()}
  else if(a==='txt'){const l=ADM.tl,k=el.dataset.k,v=clean(el.value,700);S.texts[l]=S.texts[l]||{};if(!v||v===I18N[l][k])delete S.texts[l][k];else S.texts[l][k]=v;deb(()=>{saveS();if(l===cur){$$('main [data-t],.foot [data-t],.modal [data-t]').forEach(x=>x.textContent=t(x.dataset.t));$$('[data-tp]').forEach(x=>x.placeholder=t(x.dataset.tp));renderTags();applyTheme()}})}
  else if(a==='brand'||a==='sub'){S[a]=clean(el.value,40)||(a==='brand'?DEFAULTS.brand:'');deb(()=>{saveS();$('#brandName').textContent=S.brand;$('#brandSub').textContent=S.sub;$('#logo').textContent=S.brand;$('#footBrand').textContent=S.brand})}
  else if(a==='speed'){S.fx.speed=Math.min(2,Math.max(.5,Number(el.value)||1));$('#spdV').textContent=S.fx.speed+'×';applyTheme();deb(saveS)}
  return}
 if(type==='change'){
  if(el.type==='checkbox'){const m={aOn:['auto','on'],aBoth:['auto','both'],aCopy:['auto','copy'],aPopup:['auto','popup'],blobs:['fx','blobs'],glare:['fx','glare'],conf:['fx','conf'],sound:['fx','sound'],reduce:['fx','reduce']};if(m[a])S[m[a][0]][m[a][1]]=el.checked;if(a==='tplAuto')S.tplAuto=el.checked;saveS();applyTheme();toast(t('saved'));if(a==='aOn'||a==='tplAuto')renderAdmin();return}
  if(a==='color'){S.colors=guard(S.colors);saveS();applyTheme();renderAdmin();toast(t('saved'))}
  if(a==='ag'||a==='ay'){saveS();renderAdmin();toast(t('saved'))}
  return}
 if(type!=='click')return;
 const id=el.dataset.id,v=el.dataset.v;
 switch(a){
  case'rf':ADM.rf=v;renderAdmin();break;
  case'done':{const r=R.find(x=>x.id===id);if(r){r.done=!r.done;saveR();renderReqList()}break}
  case'del':if(confirm(t('confirm'))){R=R.filter(x=>x.id!==id);saveR();renderReqList();toast(t('saved'))}break;
  case'csv':exportCSV();break;
  case'clearAll':if(confirm(t('confirm'))){R=[];saveR();renderAdmin()}break;
  case'astar':{const n=+el.dataset.n;const s=new Set(S.auto.stars);s.has(n)?s.delete(n):s.add(n);S.auto.stars=[...s].sort();saveS();renderAdmin();break}
  case'testg':openUrl(gUrl());break;case'testy':openUrl(yUrl());break;
  case'cReset':S.colors=Object.assign({},BASE);S.tpl='none';saveS();applyTheme();renderAdmin();toast(t('saved'));break;
  case'tl':ADM.tl=v;renderAdmin();break;
  case'tReset':if(confirm(t('confirm'))){delete S.texts[ADM.tl];saveS();applyI18n()}break;
  case'part':S.fx.part=v;saveS();applyTheme();partType='__';applyTheme();renderAdmin();break;
  case'tpl':applyTemplate(id);break;
  case'wall':S.wall=+el.dataset.i;saveS();applyTheme();renderAdmin();setTimeout(()=>{const c=$('#car .wcard.on');c&&c.scrollIntoView({inline:'center',block:'nearest'})},30);break;
  case'carL':case'carR':{const c=$('#car');c.scrollBy({left:(a==='carL'?-1:1)*c.clientWidth*.7,behavior:'smooth'});break}
  case'deflang':S.defLang=v;saveS();renderAdmin();toast(t('saved'));break;
  case'setMgr':{const np=$('#newMgr').value;if(np.length<6){toast(t('short'));break}if(hsh(np)===(S.mstHash||hsh(DEF_MST))){toast(t('wrong'));break}S.mgrHash=hsh(np);saveS();$('#newMgr').value='';toast(t('recOk'));break}
  case'setMst':{if(ADM.role!=='master')break;const np=$('#newMst').value;if(np.length<6){toast(t('short'));break}S.mstHash=hsh(np);saveS();$('#newMst').value='';toast(t('saved'));break}
  case'export':exportJSON();break;case'import':$('#fileIn').value='';$('#fileIn').click();break;
  case'resetSet':if(confirm(t('confirm'))){const keep={mgrHash:S.mgrHash,mstHash:S.mstHash,lang:S.lang};S=Object.assign(clone(DEFAULTS),keep);saveS();applyTheme();applyI18n();toast(t('saved'))}break;
  case'wipe':if(ADM.role==='master'&&confirm(t('confirm'))&&confirm(t('sWipe')+' — '+t('confirm'))){store.del(KS);store.del(KR);S=clone(DEFAULTS);R=[];applyTheme();applyI18n();toast(t('saved'))}break;
 }}
function applyTemplate(id){if(id==='none'){S.tpl='none';S.colors=Object.assign({},BASE);S.fx.part='dust'}else{const tp=TPL_ALL.find(x=>x.id===id);if(!tp)return;S.tpl=id;S.colors=Object.assign({},BASE,{bg:tp.bg,card:tp.card,gold:tp.gold,gold2:tp.gold2,acc:tp.acc});S.fx.part=tp.p;

function init(){renderStars();renderTags();applyTheme();applyI18n();
 $('#stars').addEventListener('click',e=>{const b=e.target.closest('.star');if(b)setRating(+b.dataset.n)});
 $('#stars').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();setRating(Math.min(5,G.r+1));$$('#stars .star')[G.r-1].focus()}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();setRating(Math.max(1,G.r-1));$$('#stars .star')[G.r-1].focus()}});
 $('#toS2').onclick=toStep2;$('#back1').onclick=()=>go('s1');$('#send').onclick=submit;$('#again').onclick=resetGuest;
 $('#tags').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;G.tags.has(k)?G.tags.delete(k):G.tags.add(k);c.classList.toggle('on')});
 $('#mgrChk').onchange=e=>{e.target.dataset.touched='1';$('#contact').classList.toggle('hidden',!e.target.checked);if(e.target.checked)setTimeout(()=>$('#contact').focus(),50)};
 $('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;G.pub=b.dataset.v==='pub';$$('#seg button').forEach(x=>x.classList.toggle('on',x===b));$('#gname').classList.toggle('hidden',!G.pub)});
 ['#platBtns','#platBtns2'].forEach(s=>$(s).addEventListener('click',e=>{const b=e.target.closest('[data-plat]');if(b)publish(b.dataset.plat)}));
 $('#noPub').onclick=()=>{G.declined=true;closeModal('#mPub');renderResult(false)};
 $('#brand').addEventListener('click',tap);$('#logo').addEventListener('click',tap);
 $('#langBtn').onclick=()=>{$('#langList').innerHTML=LANGS.map(l=>'<button class="'+(l===cur?'on':'')+'" data-l="'+l+'"><span class="fl">'+FLAGS[l]+'</span>'+esc(I18N[l].lname)+'</button>').join('');openModal('#mLang')};
 $('#adLang').onclick=()=>$('#langBtn').click();
 $('#langList').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b)setLang(b.dataset.l)});
 const toggleTheme=()=>{S.mode=isDay()?'night':'day';saveS();applyTheme()};$('#themeBtn').onclick=toggleTheme;$('#adTheme').onclick=toggleTheme;
 $('#pwGo').onclick=login;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
 $('#forgotBtn').onclick=()=>{closeModal('#mLogin');$('#recErr').textContent='';openModal('#mRec')};$('#recGo').onclick=recover;
 $$('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
 $$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$$('.modal.on').pop();if(m)m.classList.remove('on')}});
 $('#adClose').onclick=closeAdmin;const P=$('#panes');['click','input','change'].forEach(ev=>P.addEventListener(ev,onAdmin));$('#tabs').addEventListener('click',onAdmin);
 $('#fileIn').onchange=e=>importJSON(e.target.files[0]);
 addEventListener('storage',e=>{if(e.key===KS){S=sanitizeSettings(loadJSON(KS));applyTheme();applyI18n()}if(e.key===KR){R=(loadJSON(KR)||[]).map(sanitizeReview).filter(Boolean);if(ADM.open)renderAdmin()}});
 setInterval(()=>{const v=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();if(!isHex(v)||!S.colors||!isHex(S.colors.bg)){S.colors=guard(S.colors||BASE);applyTheme()}},5000);
 setInterval(applyTheme,600000);
}
init();

</script>
</body>
</html>
